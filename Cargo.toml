[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
ducky-core = { path = "crates/ducky-core" }
ducky-config = { path = "crates/ducky-config" }
ducky-sql = { path = "crates/ducky-sql" }
ducky-postgres = { path = "crates/ducky-postgres" }
ducky-files = { path = "crates/ducky-files" }
ducky-app = { path = "crates/ducky-app" }
ducky-runtime = { path = "crates/ducky-runtime" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
thiserror = "2"
anyhow = "1"
url = "2.5"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sqlparser = "0.64"
tui-input = { version = "0.15", default-features = false }
arboard = "3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tachyonfx = "0.25"
edtui = { version = "0.11", default-features = false, features = ["arboard"] }
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
