name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: ducky
          POSTGRES_PASSWORD: ducky
          POSTGRES_DB: ducky
        options: >-
          --health-cmd "pg_isready -U ducky -d ducky"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DUCKY_TEST_DATABASE_URL: postgres://ducky:ducky@postgres:5432/ducky
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo llvm-cov --workspace --no-report -- --include-ignored --skip dump_then_restore
      - run: cargo llvm-cov report --html --output-dir target/coverage
      - run: cargo llvm-cov report --lcov --output-path target/coverage/lcov.info
      - uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: target/coverage
      - run: cargo llvm-cov report --summary-only --fail-under-lines 95
      - run: cargo build --workspace --release
