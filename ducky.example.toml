# Directory for saved SQL files, relative to this file.
sql_dir = "sql"
# Directory for pg_dump archives, relative to this file.
dump_dir = "dumps"
# Rows per page when browsing a table (1 to 5000, default 50).
page_size = 50

# label: optional when project is set (the profile is then named "<project> <type>"); labels may repeat.
# type: local (green), staging (orange) or prod (red).
# project (optional): groups profiles in the picker.
# tags (optional): extra words to filter on, shown as #tag.
[[profiles]]
label = "Shop local"
project = "shop"
type = "local"
url = "postgres://postgres:postgres@localhost:5432/shop"

# ${VAR} is expanded from the environment at connect time.
[[profiles]]
label = "Shop staging"
project = "shop"
type = "staging"
url = "postgres://app:${STAGING_DB_PASSWORD}@staging.example.com:5432/shop?sslmode=require"

[[profiles]]
project = "shop"
type = "prod"
tags = ["eu", "readonly"]
url = "postgres://app:${PROD_DB_PASSWORD}@prod.example.com:5432/shop?sslmode=require"

[[profiles]]
label = "Analytics local"
project = "analytics"
type = "local"
url = "postgres://postgres:postgres@localhost:5432/analytics"
